<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EliteQnA — Sign In</title>
<style>
  :root{
    --bg:#15130f;
    --bg2:#1c1912;
    --card:#211d16;
    --gold:#d9a441;
    --gold-bright:#f0c164;
    --cream:#f4ecdc;
    --muted:#9a8f78;
    --border:#3a3225;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#0d0b08;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .scene{
    position:relative;
    width:min(940px, 96vw);
    aspect-ratio:16/9.2;
    background:radial-gradient(ellipse 60% 90% at 22% 45%, var(--bg2), var(--bg) 65%);
    border-radius:18px;
    box-shadow:0 40px 90px rgba(0,0,0,.6);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
  }

  /* lamp */
  .lamp-wrap{
    position:relative;
    width:260px;
    height:100%;
    flex-shrink:0;
    pointer-events:none;
  }
  .lamp-fixture{
    position:absolute;
    top:6%; left:50%;
    width:110px;
    height:88%;
    margin-left:-55px;
  }
  .shade{
    position:absolute;
    top:0; left:0;
    width:110px; height:34px;
    background:linear-gradient(180deg,#332b1a,#171308);
    border-radius:8px 8px 55px 55px / 8px 8px 26px 26px;
    box-shadow:0 0 30px rgba(240,193,100,.4);
    z-index:2;
  }
  .pull-cord{
    position:absolute;
    top:34px; left:36px;
    width:1px; height:18px;
    background:#5a4d34;
  }
  .pull-cord::after{
    content:'';
    position:absolute;
    bottom:-4px; left:-2.5px;
    width:6px; height:6px;
    border-radius:50%;
    background:#8a7a55;
  }
  .pole{
    position:absolute;
    top:32px; bottom:22px; left:50%;
    width:3px;
    background:linear-gradient(180deg,#332b1a,#211c14);
    transform:translateX(-50%);
  }
  .base{
    position:absolute;
    bottom:0; left:50%;
    width:76px; height:9px;
    margin-left:-38px;
    border-radius:50%;
    background:linear-gradient(180deg,#332b1a,#171308);
    box-shadow:0 4px 12px rgba(0,0,0,.5);
  }
  .bulb{
    position:absolute;
    top:30px; left:50%;
    width:10px; height:10px;
    transform:translateX(-50%);
    background:var(--gold-bright);
    border-radius:50%;
    box-shadow:0 0 20px 8px rgba(240,193,100,.7);
    animation:flicker 3.2s ease-in-out infinite;
    z-index:2;
  }
  .beam{
    position:absolute;
    top:32px; left:50%;
    width:340px; height:300px;
    margin-left:-170px;
    background:linear-gradient(180deg, rgba(240,193,100,.5), rgba(240,193,100,.12) 60%, transparent 100%);
    clip-path:polygon(46% 0%, 54% 0%, 100% 100%, 0% 100%);
    animation:flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1;}
    45%{opacity:.82;}
    55%{opacity:1;}
  }
  #dust{position:absolute; left:50%; top:0; width:0; height:0;}
  .floor-glow{
    position:absolute;
    bottom:2%; left:50%;
    width:300px; height:50px;
    margin-left:-150px;
    background:radial-gradient(ellipse, rgba(240,193,100,.3), transparent 70%);
    filter:blur(4px);
  }
  .dust{
    position:absolute;
    width:2px; height:2px;
    background:rgba(240,193,100,.55);
    border-radius:50%;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(0); opacity:0;}
    15%{opacity:.7;}
    100%{transform:translateY(220px); opacity:0;}
  }

  .firefly{
    position:absolute;
    width:3px; height:3px;
    background:var(--gold-bright);
    border-radius:50%;
    box-shadow:0 0 6px 2px rgba(240,193,100,.8);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-140px) translateX(20px); opacity:0;}
  }

  .card{
    position:relative;
    z-index:1;
    width:340px;
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px 26px;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .crest{
    font-size:13px;
    letter-spacing:.12em;
    color:var(--gold);
    margin:0 0 4px;
  }
  h1{
    font-size:24px;
    margin:0 0 6px;
    color:var(--cream);
    font-weight:700;
  }
  .tagline{
    font-size:13px;
    color:var(--muted);
    margin:0;
  }
  form{margin-top:26px;}
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:16px 0 6px;
    font-family:system-ui, sans-serif;
  }
  .field{position:relative;}
  .field svg{
    position:absolute;
    left:13px; top:50%;
    transform:translateY(-50%);
    width:15px; height:15px;
    stroke:var(--muted);
    pointer-events:none;
  }
  input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:#171308;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--cream);
    font-size:15px;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  input:focus{
    outline:none;
    border-color:var(--gold);
  }
  button.signin{
    width:100%;
    margin-top:24px;
    padding:13px;
    background:var(--gold-bright);
    border:none;
    border-radius:10px;
    color:#1c1710;
    font-size:15px;
    font-weight:700;
    font-family:'Segoe UI', system-ui, sans-serif;
    cursor:pointer;
  }
  button.signin:hover{filter:brightness(1.05);}
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0 14px;
    font-size:11px;
    color:var(--muted);
    font-family:system-ui, sans-serif;
    letter-spacing:.05em;
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .socials{
    display:flex;
    gap:10px;
  }
  .socials button{
    flex:1;
    padding:11px;
    background:#171308;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--cream);
    font-size:13px;
    font-family:'Segoe UI', system-ui, sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .socials svg{width:15px; height:15px;}
  .foot{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:var(--muted);
    font-family:system-ui, sans-serif;
  }
  .foot a{color:var(--gold);text-decoration:none;}

  @media (max-width:680px){
    .scene{
      flex-direction:column;
      aspect-ratio:auto;
      height:auto;
      padding:28px 24px;
      gap:8px;
    }
    .lamp-wrap{width:180px; height:200px;}
    .card{width:100%; max-width:340px;}
  }
</style>
</head>
<body>

<div class="scene">
<div class="lamp-wrap">
  <div class="lamp-fixture">
    <div class="shade"></div>
    <div class="pull-cord"></div>
    <div class="beam"></div>
    <div class="bulb"></div>
    <div class="pole"></div>
    <div class="base"></div>
    <div id="dust"></div>
  </div>
  <div class="floor-glow"></div>
  <div id="fireflies"></div>
</div>

<div class="card">
  <div class="brand">
    <p class="crest">ELITEQNA</p>
    <h1>Welcome Back</h1>
    <p class="tagline">Enter your details to access your account</p>
  </div>
  <form onsubmit="return false;">
    <label for="user">Username</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input id="user" type="text" placeholder="Enter your username" autocomplete="username">
    </div>

    <label for="email">Email address</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      <input id="email" type="email" placeholder="Email Address" autocomplete="email">
    </div>

    <label for="pass">Password</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="signin" type="submit">Sign In</button>
  </form>
  <div class="divider">OR CONTINUE WITH</div>
  <div class="socials">
    <button type="button">
      <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.6C16.7 3 14.6 2 12 2 6.9 2 2.8 6.1 2.8 11.2S6.9 20.4 12 20.4c6.1 0 8.9-4.3 8.9-6.9 0-.6-.06-1-.14-1.4H12z"/></svg>
      Google
    </button>
    <button type="button">
      <svg viewBox="0 0 24 24" fill="var(--cream)"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.1 6.8 9.4.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.2-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9 9 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.5.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.8-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5C19.1 20.1 22 16.4 22 12c0-5.5-4.5-10-10-10z"/></svg>
      GitHub
    </button>
  </div>
  <p class="foot">New here? <a href="signup.html">Create an account</a></p>
</div>
</div>

<script>
  const dustWrap = document.getElementById('dust');
  for(let i=0;i<16;i++){
    const d = document.createElement('span');
    d.className = 'dust';
    d.style.left = (-160 + Math.random()*320) + 'px';
    d.style.top = (36 + Math.random()*20) + 'px';
    d.style.animationDuration = (3 + Math.random()*3) + 's';
    d.style.animationDelay = (Math.random()*4) + 's';
    dustWrap.appendChild(d);
  }

  const wrap = document.getElementById('fireflies');
  for(let i=0;i<14;i++){
    const f = document.createElement('span');
    f.className = 'firefly';
    f.style.left = (20 + Math.random()*180) + 'px';
    f.style.top = (120 + Math.random()*260) + 'px';
    f.style.animationDuration = (6 + Math.random()*6) + 's';
    f.style.animationDelay = (Math.random()*6) + 's';
    wrap.appendChild(f);
  }
</script>

</body>
</html>
