<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EliteQnA — Question Feed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="nav">
  <div class="logo">ELITEQNA</div>
  <div class="links">
    <a href="home.html">Home</a>
    <a href="feed.html" class="active">Feed</a>
    <a href="submit.html">Post a question</a>
    <a href="index.html">Sign in</a>
  </div>
</div>

<div class="page">
  <h1>Today's questions</h1>
  <p class="sub">Fresh practice questions from students and the daily set.</p>

  <div class="filters">
    <button class="tag active">All</button>
    <button class="tag">JEE</button>
    <button class="tag">MEXT</button>
    <button class="tag">IGCSE</button>
  </div>

  <div id="feed-list">
    <p class="sub">Loading questions…</p>
  </div>

  <a href="submit.html" class="btn btn-gold fab">+ Ask</a>
</div>

<script type="module">
  import { db } from "./firebase-init.js";
  import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const list = document.getElementById('feed-list');

  function badgeClass(exam){
    const e = (exam||'').toLowerCase();
    if (e.includes('jee')) return 'jee';
    if (e.includes('mext')) return 'mext';
    if (e.includes('igcse')) return 'igcse';
    return '';
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = String(str ?? '');
    return div.innerHTML;
  }

  function safePhoto(url){
    if (typeof url !== 'string') return null;
    const ok = url.startsWith('https://firebasestorage.googleapis.com/') ||
               url.startsWith('https://storage.googleapis.com/');
    return ok ? url : null;
  }

  function cardHTML(id, q){
    const initial = escapeHTML((q.authorName || 'S').charAt(0).toUpperCase());
    const photo = safePhoto(q.photoURL);
    const created = (typeof q.createdAt === 'number') ? new Date(q.createdAt) : new Date();
    return `<a href="question.html?id=${encodeURIComponent(id)}" style="text-decoration:none; color:inherit;"><div class="card q-card">
      <div class="q-top">
        <span class="q-subject ${badgeClass(q.exam)}">${escapeHTML((q.exam||'').toUpperCase())} · ${escapeHTML((q.subject||'').toUpperCase())}</span>
        <span class="q-meta">${created.toLocaleDateString()}</span>
      </div>
      <p class="q-title">${escapeHTML(q.title)}</p>
      ${photo ? `<img src="${photo}" style="max-width:100%; border-radius:10px;">` : ''}
      <span class="q-meta"><span class="avatar">${initial}</span> ${escapeHTML(q.authorName || 'A student')}</span>
    </div></a>`;
  }

  try {
    const q = query(collection(db, 'questions'), orderBy('createdAt', 'desc'), limit(30));
    const snap = await getDocs(q);
    if (snap.empty) {
      list.innerHTML = '<p class="sub">No questions yet — be the first to ask!</p>';
    } else {
      list.innerHTML = snap.docs.map(d => cardHTML(d.id, d.data())).join('');
    }
  } catch (err) {
    list.innerHTML = `<p class="sub">Couldn't load questions: ${err.message}</p>`;
  }
</script>
</body>
</html>
