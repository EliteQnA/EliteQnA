<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EliteQnA — Sign In</title>
<style>
  :root{
    --bg:#15130f;
    --bg2:#1c1912;
    --card:#211d16;
    --gold:#d9a441;
    --gold-bright:#f0c164;
    --cream:#f4ecdc;
    --muted:#9a8f78;
    --border:#3a3225;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 70%);
    font-family:'Georgia', 'Iowan Old Style', serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow:hidden;
    position:relative;
  }

  /* lamp */
  .lamp-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:220px;
    height:100%;
    pointer-events:none;
    z-index:0;
  }
  .lamp-fixture{
    position:absolute;
    top:0; left:50%;
    width:0; height:0;
    transform-origin:50% 0%;
    animation:swing 6s ease-in-out infinite;
  }
  @keyframes swing{
    0%,100%{transform:translateX(-50%) rotate(-2.5deg);}
    50%{transform:translateX(-50%) rotate(2.5deg);}
  }
  .cord{
    position:absolute;
    top:0; left:0;
    width:2px; height:70px;
    background:#4a4232;
  }
  .shade{
    position:absolute;
    top:70px; left:0;
    width:110px; height:34px;
    margin-left:-55px;
    background:linear-gradient(180deg,#2a2419,#171308);
    border-radius:8px 8px 50px 50px / 8px 8px 24px 24px;
    box-shadow:0 0 24px rgba(240,193,100,.35);
  }
  .bulb{
    position:absolute;
    top:100px; left:0;
    width:10px; height:10px;
    margin-left:-5px;
    background:var(--gold-bright);
    border-radius:50%;
    box-shadow:0 0 20px 8px rgba(240,193,100,.7);
    animation:flicker 3.2s ease-in-out infinite;
  }
  .beam{
    position:absolute;
    top:104px; left:0;
    width:520px; height:520px;
    margin-left:-260px;
    background:conic-gradient(from -35deg at 50% 0%,
      transparent 0deg, rgba(240,193,100,.16) 35deg, rgba(240,193,100,.05) 70deg, transparent 70deg);
    filter:blur(2px);
    animation:flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1; filter:blur(2px) brightness(1);}
    45%{opacity:.8; filter:blur(2px) brightness(.92);}
    55%{opacity:1; filter:blur(2px) brightness(1.08);}
  }
  .dust{
    position:absolute;
    width:2px; height:2px;
    background:rgba(240,193,100,.55);
    border-radius:50%;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(0); opacity:0;}
    15%{opacity:.7;}
    100%{transform:translateY(220px); opacity:0;}
  }

  .firefly{
    position:absolute;
    width:3px; height:3px;
    background:var(--gold-bright);
    border-radius:50%;
    box-shadow:0 0 6px 2px rgba(240,193,100,.8);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-140px) translateX(20px); opacity:0;}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:360px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .crest{
    font-size:13px;
    letter-spacing:.12em;
    color:var(--gold);
    margin:0 0 4px;
  }
  h1{
    font-size:24px;
    margin:0 0 4px;
    color:var(--cream);
    font-weight:600;
  }
  .tagline{
    font-size:13px;
    color:var(--muted);
    margin:0;
    font-style:italic;
  }
  form{margin-top:26px;}
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:16px 0 6px;
    font-family:system-ui, sans-serif;
  }
  input{
    width:100%;
    padding:12px 14px;
    background:#171308;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--cream);
    font-size:15px;
    font-family:system-ui, sans-serif;
  }
  input:focus{
    outline:none;
    border-color:var(--gold);
  }
  button.signin{
    width:100%;
    margin-top:24px;
    padding:13px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    border:none;
    border-radius:10px;
    color:#1c1710;
    font-size:15px;
    font-weight:700;
    font-family:system-ui, sans-serif;
    cursor:pointer;
  }
  button.signin:hover{filter:brightness(1.05);}
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0 14px;
    font-size:11px;
    color:var(--muted);
    font-family:system-ui, sans-serif;
    letter-spacing:.05em;
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .socials{
    display:flex;
    gap:10px;
  }
  .socials button{
    flex:1;
    padding:11px;
    background:#171308;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--cream);
    font-size:13px;
    font-family:system-ui, sans-serif;
    cursor:pointer;
  }
  .foot{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:var(--muted);
    font-family:system-ui, sans-serif;
  }
  .foot a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>

<div class="lamp-wrap">
  <div class="lamp-fixture">
    <div class="cord"></div>
    <div class="shade"></div>
    <div class="beam"></div>
    <div class="bulb"></div>
    <div id="dust"></div>
  </div>
  <div id="fireflies"></div>
</div>

<div class="card">
  <div class="brand">
    <p class="crest">ELITEQNA</p>
    <h1>Welcome back</h1>
    <p class="tagline">Answers you can trust</p>
  </div>
  <form onsubmit="return false;">
    <label for="user">Username</label>
    <input id="user" type="text" placeholder="Enter your username" autocomplete="username">

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">

    <button class="signin" type="submit">Sign In</button>
  </form>
  <div class="divider">OR CONTINUE WITH</div>
  <div class="socials">
    <button type="button">Google</button>
    <button type="button">GitHub</button>
  </div>
  <p class="foot">New here? <a href="#">Create an account</a></p>
</div>

<script>
  const dustWrap = document.getElementById('dust');
  for(let i=0;i<16;i++){
    const d = document.createElement('span');
    d.className = 'dust';
    d.style.left = (-160 + Math.random()*320) + 'px';
    d.style.top = (110 + Math.random()*20) + 'px';
    d.style.animationDuration = (3 + Math.random()*3) + 's';
    d.style.animationDelay = (Math.random()*4) + 's';
    dustWrap.appendChild(d);
  }

  const wrap = document.getElementById('fireflies');
  for(let i=0;i<14;i++){
    const f = document.createElement('span');
    f.className = 'firefly';
    f.style.left = (20 + Math.random()*180) + 'px';
    f.style.top = (120 + Math.random()*260) + 'px';
    f.style.animationDuration = (6 + Math.random()*6) + 's';
    f.style.animationDelay = (Math.random()*6) + 's';
    wrap.appendChild(f);
  }
</script>

</body>
</html>
