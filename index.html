<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily JEE & MEXT Questions</title>
    <!-- MathJax to render beautiful math equations -->
    <script src="https://polyfill.io"></script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f6f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .question-card { background: white; padding: 25px; margin-bottom: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        .question-text { font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.6; word-wrap: break-word; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .option-btn { padding: 14px; border: 1px solid #dcdde1; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-size: 15px; transition: all 0.2s; }
        .option-btn:hover { background: #f5f6fa; border-color: #3498db; }
        .ans-section { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd; }
        .ans-btn { background: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .ans-btn:hover { background: #2c3e50; }
        .solution-text { display: none; margin-top: 10px; padding: 10px; background: #f8f9fa; border-left: 3px solid #2ecc71; font-size: 15px; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📚 Daily JEE & MEXT Preparation</h1>
    <div id="questions-container">Loading questions, please wait...</div>

    <script>
        // ⚠️ PASTE YOUR COPIED BLUE LINK BETWEEN THE QUOTES BELOW:
        const sheetCsvUrl = "PASTE_YOUR_LINK_HERE";

        function parseCSV(text) {
            let lines = text.split('\n');
            return lines.map(line => {
                let result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            });
        }

        async function loadQuestions() {
            try {
                const response = await fetch(sheetCsvUrl);
                const text = await response.text();
                const rows = parseCSV(text);
                
                const container = document.getElementById('questions-container');
                container.innerHTML = ''; 

                // Reading rows matching your exact sheet structure
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row[0] === "" || row.length < 2) continue; 

                    // Matching columns perfectly:
                    const qText = row[0] || '';
                    const optA = row[1] || 'N/A';
                    const optB = row[2] || 'N/A';
                    const optC = row[3] || 'N/A';
                    const optD = row[4] || 'N/A';
                    const correctAns = row[5] || 'Not provided yet';

                    const cardHTML = `
                        <div class="question-card">
                            <div class="question-text">${qText}</div>
                            
                            <div class="options-grid">
                                <button class="option-btn"><strong>A.</strong> ${optA}</button>
                                <button class="option-btn"><strong>B.</strong> ${optB}</button>
                                <button class="option-btn"><strong>C.</strong> ${optC}</button>
                                <button class="option-btn"><strong>D.</strong> ${optD}</button>
                            </div>

                            <div class="ans-section">
                                <button class="ans-btn" onclick="toggleAns(${i})">Show Correct Answer</button>
                                <div id="sol-${i}" class="solution-text">
                                    Correct Answer: ${correctAns}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                }
                
                // Trigger MathJax to convert text formulas into high-quality math visuals
                if (window.MathJax && window.MathJax.typeset) {
                    window.MathJax.typeset();
                }

            } catch (error) {
                container.innerHTML = "Error: Failed to load data.";
                console.error(error);
            }
        }

        function toggleAns(id) {
            const solDiv = document.getElementById(`sol-${id}`);
            if (solDiv.style.display === "block") {
                solDiv.style.display = "none";
            } else {
                solDiv.style.display = "block";
            }
        }

        loadQuestions();
    </script>
</body>
</html>
