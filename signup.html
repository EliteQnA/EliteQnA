<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EliteQnA — Create Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="nav">
  <div class="logo">ELITEQNA</div>
  <div class="links">
    <a href="feed.html">Feed</a>
    <a href="index.html">Sign in</a>
  </div>
</div>

<div class="page" style="max-width:400px;">
  <h1>Create your account</h1>
  <p class="sub">Join students preparing for JEE, MEXT, and IGCSE.</p>

  <form id="signup-form">
    <label for="name">Full name</label>
    <input id="name" type="text" placeholder="Your name">

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label for="exam">Which exam are you preparing for?</label>
    <select id="exam">
      <option>JEE</option>
      <option>MEXT Scholarship</option>
      <option>IGCSE</option>
    </select>

    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="••••••••">

    <p id="signup-error" style="color:#e07a5f; font-size:13px; margin:14px 0 0; display:none;"></p>
    <button class="btn btn-gold" type="submit" style="width:100%; margin-top:22px;">Create account</button>
  </form>
  <p class="sub" style="margin-top:16px;">Already have an account? <a href="index.html">Sign in</a></p>
</div>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const form = document.getElementById('signup-form');
  const errorEl = document.getElementById('signup-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const exam = document.getElementById('exam').value;
    const pass = document.getElementById('pass').value;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { name, email, exam, createdAt: Date.now() });
      window.location.href = 'feed.html';
    } catch (err) {
      errorEl.textContent = err.message.replace('Firebase: ', '');
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
